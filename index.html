<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Active Timisoara</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 260px;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      color: #aaa;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    a.btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #f97316;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.03em;
      transition: background 0.2s, transform 0.1s;
    }

    a.btn:hover { background: #ea6a0a; }
    a.btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Active Timisoara" />

  <h1>Site under construction</h1>
  <p>We're working on something great. In the meantime, check out our padel community.</p>

  <a class="btn" href="https://padel.activetimisoara.ro">Go to Padel &rarr;</a>
</body>
</html>
